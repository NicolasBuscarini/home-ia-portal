services:
  api:
    image: home-ia-portal-dev
    cpus: "${PLATFORM_API_CPUS:-2.0}"
    mem_limit: "${PLATFORM_API_MEMORY_LIMIT:-3g}"
    build:
      context: .
      additional_contexts:
        web_source: "${WEB_SOURCE_CONTEXT:-../home-ia-web}"
        shared_source: "${SHARED_SOURCE_CONTEXT:-../home-ia-shared}"
        monitoring_web_source: "${MONITORING_WEB_SOURCE_CONTEXT:-../home-ia-monitoring-web}"
        platform_web_source: "${ADMIN_WEB_SOURCE_CONTEXT:-../home-ia-platform-web}"
        activitywatch_web_source: "${ACTIVITYWATCH_WEB_SOURCE_CONTEXT:-../home-ia-module-activitywatch}"
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data:/data
      - "${CAPTURE_DATA_HOST_DIR:-./data/capture}:/capture-data"
      - "${CLIP_ARCHIVE_HOST_DIR:-./data/archive}:/archive-data"
      - "${FACE_MODELS_HOST_DIR:-./data/face-models}:/face-models:ro"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_WEBROOT: /app/web
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      CAPTURE_CAMERA_ID: "${CAPTURE_CAMERA_ID:-garage-01}"
      CAPTURE_SPOOL_DIRECTORY: /capture-data
      CAPTURE_MAX_SEGMENTS: "${CAPTURE_MAX_SEGMENTS:-120}"
      CAPTURE_MAX_SEGMENT_BYTES: "${CAPTURE_MAX_SEGMENT_BYTES:-67108864}"
      CLIP_TRIGGER_SAMPLE_FPS: "${CLIP_TRIGGER_SAMPLE_FPS:-1}"
      CLIP_TRIGGER_WIDTH: "${CLIP_TRIGGER_WIDTH:-160}"
      CLIP_TRIGGER_HEIGHT: "${CLIP_TRIGGER_HEIGHT:-90}"
      CLIP_TRIGGER_PIXEL_DELTA: "${CLIP_TRIGGER_PIXEL_DELTA:-24}"
      CLIP_TRIGGER_CHANGED_AREA_RATIO: "${CLIP_TRIGGER_CHANGED_AREA_RATIO:-0.05}"
      CLIP_TRIGGER_GLOBAL_CHANGED_AREA_RATIO: "${CLIP_TRIGGER_GLOBAL_CHANGED_AREA_RATIO:-0.85}"
      CLIP_TRIGGER_ZONE: "${CLIP_TRIGGER_ZONE:-0,0,1,1}"
      CLIP_TRIGGER_MASKS: "${CLIP_TRIGGER_MASKS:-}"
      CLIP_TRIGGER_COOLDOWN_SECONDS: "${CLIP_TRIGGER_COOLDOWN_SECONDS:-10}"
      CLIP_PRE_EVENT_SECONDS: "${CLIP_PRE_EVENT_SECONDS:-10}"
      CLIP_POST_EVENT_SECONDS: "${CLIP_POST_EVENT_SECONDS:-20}"
      CLIP_MAX_SECONDS: "${CLIP_MAX_SECONDS:-120}"
      CLIP_PLAYBACK_CACHE_BYTES: "${CLIP_PLAYBACK_CACHE_BYTES:-2147483648}"
      FACE_DETECTOR_MODEL_PATH: "${FACE_DETECTOR_MODEL_PATH:-/face-models/yunet-2023mar.onnx}"
      FACE_DETECTOR_MODEL_SHA256: "${FACE_DETECTOR_MODEL_SHA256:-}"
      FACE_RECOGNIZER_MODEL_PATH: "${FACE_RECOGNIZER_MODEL_PATH:-/face-models/sface-2021dec.onnx}"
      FACE_RECOGNIZER_MODEL_SHA256: "${FACE_RECOGNIZER_MODEL_SHA256:-}"
      FACE_EXTRACTOR_MODEL_VERSION: "${FACE_EXTRACTOR_MODEL_VERSION:-2021dec}"
      FACE_MINIMUM_PIXELS: "${FACE_MINIMUM_PIXELS:-64}"
      CLIP_TRIGGER_QUEUE_CAPACITY: "${CLIP_TRIGGER_QUEUE_CAPACITY:-8}"
      CLIP_ANALYSIS_QUEUE_CAPACITY: "${CLIP_ANALYSIS_QUEUE_CAPACITY:-8}"
      CLIP_ANALYSIS_LEASE_SECONDS: "${CLIP_ANALYSIS_LEASE_SECONDS:-60}"
      CLIP_ANALYSIS_DEFAULT_VERSION: "${CLIP_ANALYSIS_DEFAULT_VERSION:-analysis-v1}"
      DETECTOR_ONNX_MODEL_PATH: "${DETECTOR_ONNX_MODEL_PATH:-}"
      DETECTOR_MODEL_VERSION: "${DETECTOR_MODEL_VERSION:-unconfigured}"
      DETECTOR_ONNX_INPUT_NAME: "${DETECTOR_ONNX_INPUT_NAME:-images}"
      DETECTOR_ONNX_OUTPUT_NAME: "${DETECTOR_ONNX_OUTPUT_NAME:-detections}"
      DETECTOR_INPUT_WIDTH: "${DETECTOR_INPUT_WIDTH:-640}"
      DETECTOR_INPUT_HEIGHT: "${DETECTOR_INPUT_HEIGHT:-640}"
      DETECTOR_SCORE_THRESHOLD: "${DETECTOR_SCORE_THRESHOLD:-0.25}"
      DETECTOR_LABELS: "${DETECTOR_LABELS:-person}"
      DETECTOR_QUEUE_CAPACITY: "${DETECTOR_QUEUE_CAPACITY:-8}"
      DETECTOR_INTRA_OP_THREADS: "${DETECTOR_INTRA_OP_THREADS:-1}"
      DETECTOR_INTER_OP_THREADS: "${DETECTOR_INTER_OP_THREADS:-1}"
      DETECTOR_SAMPLE_EVERY_SEGMENTS: "${DETECTOR_SAMPLE_EVERY_SEGMENTS:-1}"
      BIOMETRIC_ENCRYPTION_KEY: "${BIOMETRIC_ENCRYPTION_KEY:-}"
      BIOMETRIC_ENCRYPTION_KEY_VERSION: "${BIOMETRIC_ENCRYPTION_KEY_VERSION:-}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:-}"
      CREDENTIAL_ENCRYPTION_KEY_VERSION: "${CREDENTIAL_ENCRYPTION_KEY_VERSION:-}"
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEY: "${CREDENTIAL_ENCRYPTION_PREVIOUS_KEY:-}"
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEY_VERSION: "${CREDENTIAL_ENCRYPTION_PREVIOUS_KEY_VERSION:-}"
      EVENT_RULES_FILE: "${EVENT_RULES_FILE:-}"
      EVENT_JOURNAL_MAX_EVENTS: "${EVENT_JOURNAL_MAX_EVENTS:-10000}"
      EVENT_JOURNAL_MAX_BYTES: "${EVENT_JOURNAL_MAX_BYTES:-67108864}"
      CLIP_ARCHIVE_DIRECTORY: /archive-data
      CLIP_ARCHIVE_POLL_SECONDS: "${CLIP_ARCHIVE_POLL_SECONDS:-2}"
      CLIP_ARCHIVE_MAX_CLIPS: "${CLIP_ARCHIVE_MAX_CLIPS:-10000}"
      CLIP_ARCHIVE_MAX_BYTES: "${CLIP_ARCHIVE_MAX_BYTES:-53687091200}"
      CLIP_ARCHIVE_MAX_CLIP_BYTES: "${CLIP_ARCHIVE_MAX_CLIP_BYTES:-1073741824}"
      IDENTITY_DB_PATH: "${IDENTITY_DB_PATH:-/data/identity/garagewatch.db}"
      IDENTITY_DATA_PROTECTION_PATH: "${IDENTITY_DATA_PROTECTION_PATH:-/data/identity/data-protection}"
      PORTAL_RESIDENCE_ID: "${PORTAL_RESIDENCE_ID:-home}"
      MONITORING_BASE_URL: "${MONITORING_BASE_URL:-http://monitoring:8080}"
      MONITORING_SERVICE_TOKEN_SECRET: "${MONITORING_SERVICE_TOKEN_SECRET:-}"
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
      NEOLINK_CONTROL_URL: "${NEOLINK_CONTROL_URL:-http://neolink:8555}"
      NEOLINK_CONTROL_TOKEN: "${NEOLINK_CONTROL_TOKEN:-}"
      ACTIVITYWATCH_BASE_URL: "${ACTIVITYWATCH_BASE_URL:-http://activitywatch:5600}"
      ACTIVITYWATCH_API_TOKEN: "${ACTIVITYWATCH_API_TOKEN:-}"
      ACTIVITYWATCH_TIMEOUT_SECONDS: "${ACTIVITYWATCH_TIMEOUT_SECONDS:-3}"
      ACTIVITYWATCH_LOOKBACK_HOURS: "${ACTIVITYWATCH_LOOKBACK_HOURS:-24}"
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - dotnet
      - run
      - --project
      - src/GarageWatch.Api/GarageWatch.Api.csproj
      - --urls
      - http://0.0.0.0:8080

  test:
    image: home-ia-portal-dev
    build:
      context: .
      additional_contexts:
        web_source: "${WEB_SOURCE_CONTEXT:-../home-ia-web}"
        shared_source: "${SHARED_SOURCE_CONTEXT:-../home-ia-shared}"
        monitoring_web_source: "${MONITORING_WEB_SOURCE_CONTEXT:-../home-ia-monitoring-web}"
        platform_web_source: "${ADMIN_WEB_SOURCE_CONTEXT:-../home-ia-platform-web}"
        activitywatch_web_source: "${ACTIVITYWATCH_WEB_SOURCE_CONTEXT:-../home-ia-module-activitywatch}"
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    profiles: [test]
    cpus: "${PLATFORM_TEST_CPUS:-2.0}"
    mem_limit: "${PLATFORM_TEST_MEMORY_LIMIT:-3g}"
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DOTNET_CLI_HOME: /tmp
      NUGET_PACKAGES: /tmp/nuget
      HOME: /tmp
      GARAGEWATCH_WEB_ROOT: /app/web
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      CAPTURE_CAMERA_ID: capture-test
      CAPTURE_SPOOL_DIRECTORY: /tmp/capture
      CAPTURE_MAX_SEGMENTS: "4"
      CAPTURE_MAX_SEGMENT_BYTES: "1048576"
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - dotnet
      - test
      - GarageWatch.slnx
      - --configuration
      - Release

  api-camera-integration:
    extends:
      service: api
    profiles: [camera-integration]
    ports: !override
      - "127.0.0.1:${RTSP_APP_PORT:-8084}:8080"
    environment:
      CAPTURE_CAMERA_ID: "${CAPTURE_CAMERA_ID:-garage-01}"
      NEOLINK_CONTROL_URL: "${NEOLINK_CONTROL_URL:-http://neolink:8555}"
      NEOLINK_CONTROL_TOKEN: "${NEOLINK_CONTROL_TOKEN:-}"
    networks:
      - default
      - rtsp_lab

  rtsp-test-server:
    image: bluenviron/mediamtx:1.12.3@sha256:3634a1eed1288b93e8d22ed74694eae96d483fcf676cac5d0c91830ad1b86b3d
    profiles: [rtsp-contract]
    expose:
      - "8554"

  rtsp-test-publisher:
    image: home-ia-portal-dev
    build:
      context: .
      additional_contexts:
        web_source: "${WEB_SOURCE_CONTEXT:-../home-ia-web}"
        shared_source: "${SHARED_SOURCE_CONTEXT:-../home-ia-shared}"
        monitoring_web_source: "${MONITORING_WEB_SOURCE_CONTEXT:-../home-ia-monitoring-web}"
        platform_web_source: "${ADMIN_WEB_SOURCE_CONTEXT:-../home-ia-platform-web}"
        activitywatch_web_source: "${ACTIVITYWATCH_WEB_SOURCE_CONTEXT:-../home-ia-module-activitywatch}"
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    profiles: [rtsp-contract]
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      - rtsp-test-server
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - bash
      - -lc
      - >-
        while true; do
        ffmpeg -nostdin -hide_banner -loglevel error -re -f lavfi -i testsrc=size=640x360:rate=15
        -f lavfi -i sine=frequency=1000:sample_rate=16000 -map 0:v:0 -map 1:a:0
        -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.0 -pix_fmt yuv420p -g 15
        -c:a aac -b:a 64k -ar 16000 -ac 1
        -f rtsp -rtsp_transport tcp rtsp://rtsp-test-server:8554/garage;
        sleep 1;
        done

  api-rtsp-contract:
    image: home-ia-portal-dev
    build:
      context: .
      additional_contexts:
        web_source: "${WEB_SOURCE_CONTEXT:-../home-ia-web}"
        shared_source: "${SHARED_SOURCE_CONTEXT:-../home-ia-shared}"
        monitoring_web_source: "${MONITORING_WEB_SOURCE_CONTEXT:-../home-ia-monitoring-web}"
        platform_web_source: "${ADMIN_WEB_SOURCE_CONTEXT:-../home-ia-platform-web}"
        activitywatch_web_source: "${ACTIVITYWATCH_WEB_SOURCE_CONTEXT:-../home-ia-module-activitywatch}"
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    profiles: [rtsp-contract]
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /workspace
    depends_on:
      - rtsp-test-publisher
    volumes:
      - .:/workspace
      - ./data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
      CAPTURE_CAMERA_ID: rtsp-contract
      CAPTURE_SPOOL_DIRECTORY: "/data/rtsp-contract-${RTSP_CONTRACT_RUN_ID:-manual}"
      CAPTURE_MAX_SEGMENTS: "8"
      CAPTURE_MAX_SEGMENT_BYTES: "16777216"
      IDENTITY_DB_PATH: "/tmp/identity/garagewatch-${RTSP_CONTRACT_RUN_ID:-manual}.db"
      IDENTITY_DATA_PROTECTION_PATH: "/tmp/identity/data-protection-${RTSP_CONTRACT_RUN_ID:-manual}"
      MONITORING_BASE_URL: "${MONITORING_BASE_URL:-http://monitoring:8080}"
      MONITORING_SERVICE_TOKEN_SECRET: "${MONITORING_SERVICE_TOKEN_SECRET:-}"
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
    ports:
      - "127.0.0.1:${RTSP_CONTRACT_PORT:-8082}:8080"
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - dotnet
      - run
      - --project
      - src/GarageWatch.Api/GarageWatch.Api.csproj
      - --urls
      - http://0.0.0.0:8080

  shared-build:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [web-dev]
    cpus: "${PLATFORM_WEB_CPUS:-1.0}"
    mem_limit: "${PLATFORM_WEB_MEMORY_LIMIT:-1g}"
    init: true
    working_dir: /home-ia-shared
    volumes:
      - ../home-ia-shared:/home-ia-shared
      - shared_build_node_modules:/home-ia-shared/node_modules
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    command: sh -lc 'npm ci --omit=peer && npm run build'

  web-dev:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [web-dev]
    depends_on:
      shared-build:
        condition: service_completed_successfully
    cpus: "${PLATFORM_WEB_CPUS:-1.0}"
    mem_limit: "${PLATFORM_WEB_MEMORY_LIMIT:-1g}"
    init: true
    working_dir: /web
    volumes:
      - ../home-ia-web:/web
      - ../home-ia-shared:/home-ia-shared:ro
      - web_node_modules:/web/node_modules
    environment:
      VITE_API_PROXY_TARGET: "${VITE_API_PROXY_TARGET:-http://api:8080}"
      VITE_MONITORING_REMOTE_URL: "http://127.0.0.1:5174/remoteEntry.js"
      VITE_PLATFORM_REMOTE_URL: "http://127.0.0.1:5175/remoteEntry.js"
      VITE_ACTIVITYWATCH_REMOTE_URL: "http://127.0.0.1:5176/remoteEntry.js"
      NPM_CONFIG_CACHE: /tmp/npm-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    command: sh -lc 'npm ci && npm run dev -- --host 0.0.0.0'

  monitoring-web-dev:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [web-dev]
    depends_on:
      shared-build:
        condition: service_completed_successfully
    cpus: "${PLATFORM_WEB_CPUS:-1.0}"
    mem_limit: "${PLATFORM_WEB_MEMORY_LIMIT:-1g}"
    init: true
    working_dir: /monitoring-web
    volumes:
      - ../home-ia-monitoring-web:/monitoring-web
      - ../home-ia-shared:/home-ia-shared:ro
      - monitoring_web_node_modules:/monitoring-web/node_modules
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5174:5174"
    command: sh -lc 'npm ci && npm run dev -- --host 0.0.0.0 --port 5174 --strictPort'

  platform-web-dev:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [web-dev]
    depends_on:
      shared-build:
        condition: service_completed_successfully
    cpus: "${PLATFORM_WEB_CPUS:-1.0}"
    mem_limit: "${PLATFORM_WEB_MEMORY_LIMIT:-1g}"
    init: true
    working_dir: /platform-web
    volumes:
      - ../home-ia-platform-web:/platform-web
      - ../home-ia-shared:/home-ia-shared:ro
      - platform_web_node_modules:/platform-web/node_modules
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5175:5175"
    command: sh -lc 'npm ci && npm run dev -- --host 0.0.0.0 --port 5175 --strictPort'

  activitywatch-web-dev:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [web-dev]
    depends_on:
      shared-build:
        condition: service_completed_successfully
    cpus: "${PLATFORM_WEB_CPUS:-1.0}"
    mem_limit: "${PLATFORM_WEB_MEMORY_LIMIT:-1g}"
    init: true
    working_dir: /activitywatch-web
    volumes:
      - ../home-ia-module-activitywatch:/activitywatch-web
      - ../home-ia-shared:/home-ia-shared:ro
      - activitywatch_web_node_modules:/activitywatch-web/node_modules
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5176:5176"
    command: sh -lc 'npm ci && npm run dev -- --host 0.0.0.0 --port 5176 --strictPort'

  activitywatch:
    image: garage-watch-activitywatch
    build:
      context: .
      dockerfile: Dockerfile.activitywatch
    cpus: "${PLATFORM_ACTIVITYWATCH_CPUS:-0.5}"
    mem_limit: "${PLATFORM_ACTIVITYWATCH_MEMORY_LIMIT:-512m}"
    init: true
    volumes:
      - activitywatch_data:/data
    ports:
      - "127.0.0.1:${ACTIVITYWATCH_HOST_PORT:-5600}:5600"
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  rtsp_lab:
    name: garage-watch-rtsp-lab
    external: true

volumes:
  web_node_modules:
  shared_build_node_modules:
  monitoring_web_node_modules:
  platform_web_node_modules:
  activitywatch_web_node_modules:
  activitywatch_data:
    # Mantido do projeto anterior para preservar o histórico do ActivityWatch (ADR109, runbook 19).
    name: garage-watch-platform_activitywatch_data
